<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NitroClash 11v11 Replay Viewer</title>
<style>

  #canvas{display:block;width:100%;height:100%}#top{position:fixed;top:12px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 4px #000;pointer-events:none}#score{font-size:34px;font-weight:bold}#meta{font-size:13px;opacity:.9}
  #controls{position:fixed;left:12px;right:12px;bottom:12px;padding:10px;background:#071425e8;border:1px solid #69d5ff;border-radius:11px;box-shadow:0 5px 22px #0008;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:9px;align-items:center}#seek{width:100%;accent-color:#69d5ff}#time{min-width:110px;text-align:center;font-variant-numeric:tabular-nums}#markers{position:absolute;left:74px;right:327px;top:7px;height:5px;pointer-events:none}.marker{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd84d;transform:translateX(-50%)}
  #open{position:fixed;inset:0;display:grid;place-items:center;background:#06111eea;z-index:5}#card{width:min(560px,90vw);padding:30px;text-align:center;background:#0c1d34;border:2px solid #69d5ff;border-radius:18px;box-shadow:0 16px 60px #000b}#card h1{margin:0 0 12px;color:#7edfff}#card p{line-height:1.45;opacity:.9}#drop{margin:20px 0;padding:30px;border:2px dashed #69d5ff;border-radius:12px;background:#102744}#error{min-height:20px;color:#ff8793}.hidden{display:none!important}
  #hint{position:fixed;right:14px;top:14px;padding:7px 9px;border-radius:7px;background:#071425bb;font-size:13px}.blue{color:#66b7ff}.red{color:#ff7183}
  @media(max-width:760px){#controls{grid-template-columns:auto 1fr auto}#camera,#speed{grid-row:2}#markers{display:none}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="top"><div id="score">0 – 0</div><div id="meta">Open a replay to begin</div></div>
<div id="hint">Space: play/pause · C: camera · wheel: zoom</div>
<div id="controls">
  <button id="play" disabled>▶ Play</button>
  <input id="seek" type="range" min="0" max="1" step="1" value="0" disabled aria-label="Replay position">
  <span id="time">0:00 / 0:00</span>
  <select id="speed" disabled aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="4">4×</option></select>
  <select id="camera" disabled aria-label="Camera"><option value="full">Full pitch</option><option value="ball">Follow ball</option></select>
  <div id="markers"></div>
</div>
<div id="open"><div id="card">
  <h1>NitroClash 11v11 Replay Viewer</h1>
  <p>Everything stays on this computer. Choose or drop a <strong>.nc11replay</strong> file.</p>
  <div id="drop">Drop replay here<br><br><button id="choose">Choose replay</button><input id="file" type="file" accept=".nc11replay,application/json" hidden></div>
  <div id="error"></div>
</div></div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d"),ui={open:$("open"),file:$("file"),choose:$("choose"),drop:$("drop"),error:$("error"),play:$("play"),seek:$("seek"),time:$("time"),speed:$("speed"),camera:$("camera"),score:$("score"),meta:$("meta"),markers:$("markers")};
let replay=null,frames=[],times=[],names=new Map(),position=0,duration=0,playing=false,last=performance.now(),zoom=1.25;
const STOCK={pitch:"assets/nc11-pitch-no-spawns.png",cleanPitch:"assets/nc11-pitch-pad-free-v22.png",padHousing:"assets/official-boost-pad-housing.png",playerBlue:"https://nitroclash.io/img/player-B.png",atlas:"https://nitroclash.io/img/spritesheet4.png",atlasData:"https://nitroclash.io/img/spritesheet4.json"},art={pitch:null,cleanPitch:null,padHousing:null,playerBlue:null,atlas:null,frames:null};
function loadArtImage(src){return new Promise(resolve=>{const image=new Image();if(/^https?:/i.test(src))image.crossOrigin="anonymous";image.decoding="async";image.onload=()=>resolve(image);image.onerror=()=>resolve(null);image.src=src;});}
Promise.all([loadArtImage(STOCK.pitch),loadArtImage(STOCK.cleanPitch),loadArtImage(STOCK.padHousing),loadArtImage(STOCK.playerBlue),loadArtImage(STOCK.atlas),fetch(STOCK.atlasData).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([pitchImage,cleanPitch,padHousing,playerImage,atlasImage,data])=>{art.pitch=pitchImage;art.cleanPitch=cleanPitch;art.padHousing=padHousing;art.playerBlue=playerImage;art.atlas=atlasImage;art.frames=data?.frames||null;});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,fmt=ms=>`${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,"0")}`;

addEventListener("resize",resize);resize();
function decode(value){if(!value||value.format!=="NC11-REPLAY"||!Array.isArray(value.frames))throw new Error("This is not a valid .nc11replay file.");if(!value.frames.length)throw new Error("This replay contains no recorded gameplay frames.");return value;}

function openFile(file){ui.error.textContent="";const reader=new FileReader();reader.onload=()=>{try{loadReplayData(JSON.parse(reader.result));}catch(error){ui.error.textContent=error.message;}};reader.onerror=()=>ui.error.textContent="Could not read that file.";reader.readAsText(file);}
ui.choose.onclick=()=>ui.file.click();ui.file.onchange=()=>ui.file.files[0]&&openFile(ui.file.files[0]);for(const type of ["dragenter","dragover"])ui.drop.addEventListener(type,e=>{e.preventDefault();ui.drop.style.background="#19436b";});for(const type of ["dragleave","drop"])ui.drop.addEventListener(type,e=>{e.preventDefault();ui.drop.style.background="";});ui.drop.addEventListener("drop",e=>e.dataTransfer.files[0]&&openFile(e.dataTransfer.files[0]));
function toggle(){if(!replay)return;playing=!playing;if(position>=duration&&playing)position=0;ui.play.textContent=playing?"❚❚ Pause":"▶ Play";last=performance.now();}
ui.play.onclick=toggle;ui.seek.oninput=()=>{position=Number(ui.seek.value);updateLabels();};
addEventListener("keydown",e=>{if(e.key.toLowerCase()==="c"&&replay){e.preventDefault();const i=(ui.camera.selectedIndex+1)%ui.camera.options.length;ui.camera.selectedIndex=i;return;}if(e.code==="Space"&&!e.target.matches("button,select")){e.preventDefault();toggle();}});
canvas.addEventListener("wheel",e=>{if(!replay||ui.camera.value==="full")return;e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.001),.65,3.5);},{passive:false});
function locate(ms){let lo=0,hi=times.length-1;while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(times[mid]<=ms)lo=mid;else hi=mid-1;}const a=lo,b=Math.min(frames.length-1,a+1),span=Math.max(1,times[b]-times[a]);return {a:frames[a],b:frames[b],t:clamp((ms-times[a])/span,0,1)};}
function playerMap(frame){return new Map((frame.p||[]).map(p=>[p[0],p]));}
function interpolated(){const q=locate(position),am=playerMap(q.a),bm=playerMap(q.b),players=[];for(const [slot,a] of am){if(!a[7])continue;const b=bm.get(slot)||a;players.push([slot,lerp(a[1],b[1],q.t),lerp(a[2],b[2],q.t),lerp(a[3],b[3],q.t),lerp(a[4]||0,b[4]||0,q.t),lerp(a[5]||0,b[5]||0,q.t),lerp(a[6]||0,b[6]||0,q.t),1,a[8]||0,q.t<.5?a[9]:b[9]]);}const ab=q.a.b||[75,42.1875],bb=q.b.b||ab;return {players,ball:[lerp(ab[0],bb[0],q.t),lerp(ab[1],bb[1],q.t),lerp(ab[4]||0,bb[4]||0,q.t)],score:q.t<.5?q.a.score:q.b.score,pads:q.t<.5?q.a.pads:q.b.pads,clock:lerp(q.a.clock||0,q.b.clock||0,q.t)};}
function cameraView(scene,w,h){const mode=replay?.mode||{},W=mode.FIELD_WIDTH||150,H=mode.FIELD_HEIGHT||84.375,fullScale=Math.min(w/W,h/H);if(ui.camera.value==="full")return {scale:fullScale,ox:(w-W*fullScale)/2,oy:(h-H*fullScale)/2};let focus=scene.ball;if(ui.camera.value!=="ball"){const p=scene.players.find(x=>String(x[0])===ui.camera.value);if(p)focus=[p[1],p[2]];}const referenceScale=Math.min(w/(mode.ORIGINAL_FIELD_WIDTH||100),h/(mode.ORIGINAL_FIELD_HEIGHT||56.25)),scale=referenceScale*zoom;return {scale,ox:w/2-focus[0]*scale,oy:h/2-focus[1]*scale};}
function pitch(c,mode,pads,active){const W=mode.FIELD_WIDTH||160,H=mode.FIELD_HEIGHT||90,R=mode.FIELD_CORNER_RADIUS||7,opening=mode.GOAL_OPENING||15,depth=mode.GOAL_DEPTH||5,padRadius=mode.BOOST_PAD_RADIUS||.9,S=mode.PITCH_SCALE||1,g1=(H-opening)/2,g2=g1+opening;c.save();c.beginPath();c.roundRect(0,0,W,H,R);c.clip();for(let i=0;i<16;i++){c.fillStyle=i%2?"#1d754d":"#176b45";c.fillRect(i*W/16,0,W/16,H);}c.restore();c.strokeStyle="#d8fff0";c.lineWidth=.35;c.beginPath();c.moveTo(0,g1);c.lineTo(0,R);c.quadraticCurveTo(0,0,R,0);c.lineTo(W-R,0);c.quadraticCurveTo(W,0,W,R);c.lineTo(W,g1);c.moveTo(W,g2);c.lineTo(W,H-R);c.quadraticCurveTo(W,H,W-R,H);c.lineTo(R,H);c.quadraticCurveTo(0,H,0,H-R);c.lineTo(0,g2);c.stroke();c.beginPath();c.moveTo(W/2,0);c.lineTo(W/2,H);c.stroke();c.beginPath();c.arc(W/2,H/2,12*S,0,Math.PI*2);c.stroke();c.strokeStyle="#278ce8";c.lineWidth=.7;c.beginPath();c.moveTo(0,g1);c.lineTo(-depth,g1);c.lineTo(-depth,g2);c.lineTo(0,g2);c.stroke();c.strokeStyle="#e84258";c.beginPath();c.moveTo(W,g1);c.lineTo(W+depth,g1);c.lineTo(W+depth,g2);c.lineTo(W,g2);c.stroke();for(let i=0;i<pads.length;i++){const p=pads[i],on=active?.[i];c.beginPath();c.fillStyle=on?"#ffd84d":"#755f23";c.arc(p[0],p[1],padRadius,0,Math.PI*2);c.fill();}}
function buildStockPitchCache(mode,pads){if(!art.pitch?.naturalWidth)return null;const W=2048,H=1152,iw=art.pitch.naturalWidth,ih=art.pitch.naturalHeight,k=W/iw,canvas=document.createElement("canvas");canvas.width=W;canvas.height=H;const c=canvas.getContext("2d",{alpha:false});c.drawImage(art.pitch,0,0,W,H);const cleanSpawn=x=>{const width=54,sourceTop=900,targetTop=1090,height=124;c.drawImage(art.pitch,x,sourceTop,width,height,x*k,targetTop*k,width*k,height*k);c.save();c.strokeStyle="rgba(225,235,180,.45)";c.lineWidth=16*k;c.beginPath();c.moveTo(x*k,1152*k);c.lineTo((x+width)*k,1152*k);c.stroke();c.restore();};cleanSpawn(906);cleanSpawn(3136);c.fillStyle="#000";c.fillRect(0,1000*k,148*k,304*k);c.fillRect(3948*k,1000*k,(iw-3948)*k,304*k);if(art.cleanPitch?.naturalWidth){const sw=mode.FIELD_WIDTH||150,sh=mode.FIELD_HEIGHT||84.375,radius=1.55*W/sw,size=Math.ceil(radius*2),patch=document.createElement("canvas");patch.width=patch.height=size;const pc=patch.getContext("2d"),cw=art.cleanPitch.naturalWidth,ch=art.cleanPitch.naturalHeight;for(const pad of pads.slice(0,mode.STOCK_BOOST_PAD_COUNT||14)){const tx=pad[0]/sw*W,ty=pad[1]/sh*H,sx=(tx-radius)/W*cw,sy=(ty-radius)/H*ch;pc.clearRect(0,0,size,size);pc.globalCompositeOperation="source-over";pc.drawImage(art.cleanPitch,sx,sy,radius*2/W*cw,radius*2/H*ch,0,0,size,size);const clean=pc.getImageData(0,0,size,size),base=c.getImageData(Math.round(tx-radius),Math.round(ty-radius),size,size),shift=[0,0,0];let samples=0;for(let y=0;y<size;y++)for(let x=0;x<size;x++){const d=Math.hypot(x-size/2,y-size/2)/size;if(d<.46||d>.5)continue;const i=(y*size+x)*4;for(let q=0;q<3;q++)shift[q]+=base.data[i+q]-clean.data[i+q];samples++;}for(let q=0;q<3;q++)shift[q]/=Math.max(1,samples);for(let i=0;i<clean.data.length;i+=4)for(let q=0;q<3;q++)clean.data[i+q]=Math.max(0,Math.min(255,clean.data[i+q]+shift[q]));pc.putImageData(clean,0,0);pc.globalCompositeOperation="destination-in";const fade=pc.createRadialGradient(size/2,size/2,size*.29,size/2,siz function stockPitch(c,mode,pads){if(!art.pitch?.naturalWidth)return false;const key=`${mode.FIELD_WIDTH}|${mode.FIELD_HEIGHT}|${pads.length}`;if(art.pitchCacheKey!==key){art.pitchCache=buildStockPitchCache(mode,pads);art.pitchCacheKey=key;}if(!art.pitchCache)return false;c.save();c.imageSmoothingEnabled=true;c.imageSmoothingQuality="high";c.drawImage(art.pitchCache,0,0,mode.FIELD_WIDTH||150,mode.FIELD_HEIGHT||84.375);c.restore();return true;}
function stockFrame(name){const entry=art.frames?.[name],frame=entry?.frame||entry;return frame&&Number.isFinite(frame.x)?frame:null;}
function boostArt(c,x,y,radius,on){const f=stockFrame("boost");if(!art.atlas?.naturalWidth||!f)return false;if(!on)return true;c.drawImage(art.atlas,f.x,f.y,f.w,f.h,x-radius,y-radius,radius*2,radius*2);return true;}
function boostHousing(c,x,y,mode){const radius=mode.BOOST_PAD_HOUSING_IMAGE_RADIUS||2;if(!art.padHousing?.naturalWidth)return false;c.save();c.globalAlpha=mode.BOOST_PAD_HOUSING_OPACITY??1;c.drawImage(art.padHousing,x-radius,y-radius,radius*2,radius*2);c.restore();return true;}
const vectorPitch=pitch;
pitch=(c,mode,pads,active)=>{if(!stockPitch(c,mode,pads))vectorPitch(c,mode,[],active);const radius=mode.BOOST_PAD_RADIUS||1.25;for(let i=0;i<pads.length;i++){const on=!!active?.[i],x=pads[i][0],y=pads[i][1];if(!on)boostHousing(c,x,y,mode);if(on&&!boostArt(c,x,y,radius,true)){c.beginPath();c.fillStyle="#ffe55b";c.arc(x,y,radius,0,Math.PI*2);c.fill();}}};
function playerArt(c,p,radius){if(!art.playerBlue?.naturalWidth)return false;c.save();c.translate(p[1],p[2]);c.rotate(p[3]);if(p[0]%2)c.filter="hue-rotate(145deg) saturate(1.28) brightness(1.05)";c.drawImage(art.playerBlue,-radius,-radius,radius*2,radius*2);c.restore();return true;}
function ballArt(c,ball,radius){const f=stockFrame("ballWFG");if(!art.atlas?.naturalWidth||!f)return false;c.save();c.translate(ball[0],ball[1]);c.rotate(ball[2]||0);c.drawImage(art.atlas,f.x,f.y,f.w,f.h,-radius,-radius,radius*2,radius*2);c.restore();return true;}
function flame(c,p){const dx=Math.cos(p[3]),dy=Math.sin(p[3]),px=-dy,py=dx,x=p[1],y=p[2];c.beginPath();c.fillStyle="#ff7926";c.moveTo(x-dx*.5+px*.42,y-dy*.5+py*.42);c.lineTo(x-dx*2.35,y-dy*2.35);c.lineTo(x-dx*.5-px*.42,y-dy*.5-py*.42);c.closePath();c.fill();c.beginPath();c.fillStyle="#ffe66a";c.moveTo(x-dx*.55+px*.2,y-dy*.55+py*.2);c.lineTo(x-dx*1.55,y-dy*1.55);c.lineTo(x-dx*.55-px*.2,y-dy*.55-py*.2);c.closePath();c.fill();}
function draw(){const d=devicePixelRatio||1,w=canvas.width,h=canvas.height;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#061522";ctx.fillRect(0,0,w,h);if(!replay)return;const scene=interpolated(),view=cameraView(scene,w,h),mode=replay.mode||{};ctx.setTransform(view.scale,0,0,view.scale,view.ox,view.oy);pitch(ctx,mode,replay.boostPads||[],scene.pads);for(const p of scene.players){if(p[9])flame(ctx,p);ctx.beginPath();ctx.fillStyle=p[0]%2?"#e84258":"#278ce8";ctx.arc(p[1],p[2],mode.PLAYER_RADIUS||.82,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="1.5px Arial";ctx.textAlign="center";ctx.fillText(names.get(p[0])||`Player ${p[0]+1}`,p[1],p[2]-1.35);}ctx.beginPath();ctx.fillStyle="#fff";ctx.arc(scene.ball[0],scene.ball[1],mode.BALL_RADIUS||1.18,0,Math.PI*2);ctx.fill();ui.score.textContent=`${scene.score?.[0]||0} – ${scene.score?.[1]||0}`;}

</script>
